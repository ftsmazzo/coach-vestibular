# Referência local — no EasyPanel use Postgres + App separados
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach_local_dev
      POSTGRES_DB: coach_vestibular
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach_vestibular"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://coach:coach_local_dev@postgres:5432/coach_vestibular
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RUN_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
